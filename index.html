<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora CLP → COP Smart</title>
    
    <!-- PWA / App Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SimuCLP">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            background: #f1f5f9;
            perspective: 1000px;
        }

        /* Animación de entrada sutil */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }

        /* Glassmorphism Refinado */
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            transform: translateY(-3px) rotateX(1deg);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.05);
        }

        .btn-3d {
            transition: all 0.1s ease;
            box-shadow: 0 3px 0px #3730a3;
        }

        .btn-3d:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0px #3730a3;
        }

        .spinning { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        #modalProyeccion {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(5px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 1.2rem;
        }
        #modalProyeccion.active { display: flex; }

        canvas { max-height: 160px; }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-3 md:p-6 lg:p-8">

    <!-- Modal de Proyección -->
    <div id="modalProyeccion" onclick="toggleModal(false)">
        <div class="bg-white w-full max-w-sm rounded-[1.5rem] overflow-hidden shadow-2xl border border-white animate-fade-in" onclick="event.stopPropagation()">
            <div class="bg-indigo-600 p-4 text-white text-center">
                <h3 class="font-bold uppercase text-[10px] tracking-widest">Proyección de Retiro Actual</h3>
                <p id="modalSubtitulo" class="text-[8px] opacity-80 mt-1">Simulación basada en tu monto configurado</p>
            </div>
            <div class="max-h-[45vh] overflow-y-auto custom-scroll">
                <table class="w-full text-left text-[10px]">
                    <thead class="sticky top-0 bg-slate-50 text-slate-400 font-bold uppercase border-b border-slate-100">
                        <tr>
                            <th class="px-4 py-2.5">TRM</th>
                            <th class="px-4 py-2.5 text-right">Base COP</th>
                            <th class="px-4 py-2.5 text-right text-indigo-600 font-black">Total + Gastos</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProyeccionBody" class="divide-y divide-slate-50 font-medium text-slate-600 italic">
                    </tbody>
                </table>
            </div>
            <div class="p-3 bg-slate-50 text-center">
                <button onclick="toggleModal(false)" class="text-indigo-600 font-bold text-[9px] uppercase tracking-widest hover:underline">Cerrar</button>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto space-y-5">
        <!-- Header Compacto -->
        <header class="text-center animate-fade-in">
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">Calculadora <span class="text-indigo-600 italic">Smart</span></h1>
            <p class="text-[9px] text-slate-400 font-black uppercase tracking-[0.2em] mt-1">Gestión CLP ➔ COP</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
            <!-- Sidebar (4/12) -->
            <aside class="md:col-span-4 space-y-4 animate-fade-in" style="animation-delay: 0.1s">
                <div class="glass-card p-5 rounded-3xl shadow-sm border-slate-200/50">
                    <h2 class="text-[8px] font-black text-slate-300 uppercase tracking-widest mb-4 italic">Parámetros</h2>
                    
                    <div class="space-y-3.5">
                        <div>
                            <label class="block text-[8px] font-bold text-slate-400 mb-1 uppercase ml-1">Retiro Chile (CLP)</label>
                            <input type="number" id="montoRetiro" value="300000" oninput="ejecutarSimulacion()" class="w-full bg-slate-50 border border-slate-100 rounded-xl px-3 py-2 font-bold text-sm focus:ring-2 focus:ring-indigo-100 outline-none">
                        </div>

                        <div>
                            <label class="block text-[8px] font-bold text-indigo-400 mb-1 uppercase ml-1">Cupo Directo (CLP)</label>
                            <input type="number" id="montoCupo" value="50000" oninput="ejecutarSimulacion()" class="w-full bg-indigo-50/40 border border-indigo-100 rounded-xl px-3 py-2 font-bold text-sm text-indigo-700 focus:ring-2 focus:ring-indigo-100 outline-none">
                        </div>

                        <div>
                            <label class="block text-[8px] font-bold text-slate-400 mb-1 flex justify-between uppercase ml-1">
                                TRM Actual
                                <span id="updateTime" class="text-[7px] font-normal lowercase opacity-40"></span>
                            </label>
                            <div class="flex gap-2">
                                <input type="number" step="0.01" id="tipoCambio" value="4.06" oninput="ejecutarSimulacion()" class="w-full bg-slate-50 border border-slate-100 rounded-xl px-3 py-2 font-bold text-xs outline-none focus:ring-2 focus:ring-indigo-100">
                                <button onclick="buscarTRM()" class="bg-indigo-600 text-white p-2 rounded-xl shadow-lg hover:bg-indigo-700 active:scale-90 transition-all flex items-center justify-center">
                                    <svg id="trmIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                </button>
                            </div>
                        </div>

                        <button onclick="ejecutarSimulacion()" class="btn-3d w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl text-[9px] uppercase tracking-widest hover:bg-indigo-700">
                            Calcular
                        </button>

                        <button onclick="mostrarProyeccionRetiro()" class="w-full bg-white text-slate-400 font-bold py-1.5 rounded-xl text-[7px] uppercase border border-slate-100 hover:text-indigo-600 hover:border-indigo-100 transition-all">
                            Tabla Proyección Retiro
                        </button>
                    </div>
                </div>
            </aside>

            <!-- Main (8/12) -->
            <main class="md:col-span-8 space-y-4">
                <!-- Info cards superiores -->
                <div class="grid grid-cols-2 gap-4 animate-fade-in" style="animation-delay: 0.2s">
                    <div class="glass-card p-5 rounded-3xl relative overflow-hidden group border-indigo-100/50">
                        <div class="absolute -right-6 -top-6 w-24 h-24 bg-indigo-50/50 rounded-full blur-2xl group-hover:bg-indigo-100 transition-colors"></div>
                        <h3 class="text-[7px] font-black text-indigo-400 uppercase tracking-widest mb-3">Análisis Cupo</h3>
                        <div class="flex items-end justify-between relative z-10">
                            <div>
                                <span class="text-[7px] text-slate-300 font-bold block mb-0.5 uppercase">Neto</span>
                                <div id="valorDirecto" class="text-lg font-extrabold text-slate-700 tracking-tight">--</div>
                            </div>
                            <div class="text-right border-l border-indigo-50 pl-3">
                                <span class="text-[7px] text-indigo-500 font-bold block mb-0.5 uppercase">Con Relación (-6.5k)</span>
                                <div id="valorRelacion" class="text-lg font-black text-indigo-600 tracking-tight">--</div>
                            </div>
                        </div>
                    </div>

                    <div class="glass-card p-4 rounded-3xl flex flex-col justify-center items-center border-slate-100">
                        <h2 class="text-[7px] font-black text-slate-300 uppercase text-center mb-2 tracking-widest">Impacto Comisión</h2>
                        <div class="w-full h-[60px]">
                            <canvas id="chartImpactoMini"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Resumen Central -->
                <section id="resumenTotal" class="animate-fade-in" style="animation-delay: 0.3s">
                    <!-- Dinámico -->
                </section>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 animate-fade-in" style="animation-delay: 0.4s">
                    <div class="glass-card p-5 rounded-3xl border-slate-100">
                        <h2 class="text-[8px] font-black text-slate-300 uppercase tracking-widest mb-4 text-center">Gasto Real</h2>
                        <div class="h-[150px]">
                            <canvas id="chartComposicion"></canvas>
                        </div>
                    </div>

                    <div class="glass-card p-5 rounded-3xl flex flex-col border-slate-100">
                        <h2 class="text-[8px] font-black text-slate-300 uppercase tracking-widest mb-4">Detalles COP</h2>
                        <div class="flex-grow">
                             <table class="w-full text-[10px] text-left">
                                <tbody id="tablaCuerpo" class="divide-y divide-slate-50 italic text-slate-500 font-medium"></tbody>
                            </table>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-50 text-center">
                            <span class="text-[7px] text-slate-300 font-bold uppercase tracking-tighter italic">
                                * Retiro (5.5k CLP / 10k COP) + Ajuste Cupo.
                            </span>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        let chartDonut = null;
        let chartImpact = null;

        const COM_CLP = 5500;
        const COM_COP = 10000;
        const COM_RELACION_COP = 6500;

        function formatMoneda(valor, moneda = 'COP') {
            return new Intl.NumberFormat(moneda === 'COP' ? 'es-CO' : 'es-CL', {
                style: 'currency',
                currency: 'COP',
                minimumFractionDigits: 0
            }).format(valor);
        }

        function toggleModal(show) {
            const modal = document.getElementById('modalProyeccion');
            if (show) modal.classList.add('active');
            else modal.classList.remove('active');
        }

        function mostrarProyeccionRetiro() {
            const body = document.getElementById('tablaProyeccionBody');
            const montoActual = parseFloat(document.getElementById('montoRetiro').value) || 0;
            body.innerHTML = '';

            for (let trm = 3.8; trm <= 4.71; trm += 0.1) {
                const baseCOP = montoActual * trm;
                const totalFinal = baseCOP + (COM_CLP * trm) + COM_COP;
                body.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="px-4 py-2 font-bold text-slate-400">${trm.toFixed(1)}</td>
                        <td class="px-4 py-2 text-right text-slate-500 font-medium">${formatMoneda(baseCOP)}</td>
                        <td class="px-4 py-2 text-right text-indigo-600 font-black italic tracking-tighter">${formatMoneda(totalFinal)}</td>
                    </tr>`;
            }
            toggleModal(true);
        }

        async function buscarTRM() {
            const icon = document.getElementById('trmIcon');
            icon.classList.add('spinning');
            try {
                const response = await fetch('https://open.er-api.com/v6/latest/CLP');
                const data = await response.json();
                if (data?.rates?.COP) {
                    const trmReal = data.rates.COP.toFixed(2);
                    document.getElementById('tipoCambio').value = trmReal;
                    document.getElementById('updateTime').innerText = `actualizado: ${new Date().toLocaleTimeString()}`;
                    ejecutarSimulacion();
                }
            } catch (e) { console.error("Error TRM:", e); }
            finally { icon.classList.remove('spinning'); }
        }

        function ejecutarSimulacion() {
            const mRetiro = parseFloat(document.getElementById('montoRetiro').value) || 0;
            const mCupo = parseFloat(document.getElementById('montoCupo').value) || 0;
            const trm = parseFloat(document.getElementById('tipoCambio').value) || 0;

            const retiroCOP = mRetiro * trm;
            const cupoCOP = mCupo * trm;
            const comisionTotalCOP = (COM_CLP * trm) + COM_COP;
            const granTotalCOP = retiroCOP + cupoCOP + comisionTotalCOP;
            const percComisionChile = ((comisionTotalCOP / (retiroCOP || 1)) * 100).toFixed(2);

            document.getElementById('valorDirecto').innerText = formatMoneda(cupoCOP);
            document.getElementById('valorRelacion').innerText = formatMoneda(cupoCOP - COM_RELACION_COP);

            const resumen = document.getElementById('resumenTotal');
            resumen.innerHTML = `
                <div class="bg-slate-900 text-white p-6 rounded-[2.5rem] shadow-xl flex flex-col sm:flex-row justify-between items-center relative overflow-hidden ring-1 ring-white/5">
                    <div class="absolute -right-12 -bottom-12 w-32 h-32 bg-indigo-500/10 rounded-full blur-3xl"></div>
                    <div class="z-10 text-center sm:text-left mb-4 sm:mb-0">
                        <span class="text-indigo-400 text-[8px] font-black uppercase tracking-[0.2em] italic ml-1">Total a Pagar</span>
                        <div class="text-3xl font-black mt-1 tracking-tight tabular-nums">${formatMoneda(granTotalCOP)}</div>
                    </div>
                    <div class="z-10 flex gap-6 text-center">
                        <div class="group">
                            <span class="text-slate-500 text-[7px] font-black uppercase block mb-1 group-hover:text-indigo-400 transition-colors tracking-tight">Neto</span>
                            <div class="text-lg font-bold tracking-tighter text-slate-200 italic">${formatMoneda(retiroCOP + cupoCOP)}</div>
                        </div>
                        <div class="border-l border-slate-800 pl-6 group">
                            <span class="text-slate-500 text-[7px] font-black uppercase block mb-1 group-hover:text-rose-500 transition-colors tracking-tight">Gastos</span>
                            <div class="text-lg font-bold text-rose-500 tracking-tighter italic">${formatMoneda(comisionTotalCOP)}</div>
                        </div>
                    </div>
                </div>`;

            const tabla = document.getElementById('tablaCuerpo');
            tabla.innerHTML = `
                <tr class="hover:bg-slate-50/50"><td class="px-4 py-2 font-bold text-slate-600">Retiro Chile</td><td class="px-4 py-2 text-right font-bold text-slate-800">${formatMoneda(retiroCOP)}</td></tr>
                <tr class="hover:bg-indigo-50/20"><td class="px-4 py-2 font-bold text-indigo-500 italic">Cupo Directo</td><td class="px-4 py-2 text-right font-bold text-indigo-600">${formatMoneda(cupoCOP)}</td></tr>
                <tr class="bg-rose-50/20 font-bold text-rose-600"><td class="px-4 py-2 uppercase text-[8px]">Gastos Retiro</td><td class="px-4 py-2 text-right">${formatMoneda(comisionTotalCOP)}</td></tr>`;

            actualizarGraficos(retiroCOP, cupoCOP, comisionTotalCOP, percComisionChile);
        }

        function actualizarGraficos(retiro, cupo, comision, pChile) {
            const ctxDonut = document.getElementById('chartComposicion').getContext('2d');
            const ctxImpact = document.getElementById('chartImpactoMini').getContext('2d');
            
            if (chartDonut) chartDonut.destroy();
            chartDonut = new Chart(ctxDonut, {
                type: 'doughnut',
                data: {
                    labels: ['Retiro', 'Cupo', 'Gastos'],
                    datasets: [{
                        data: [retiro, cupo, comision],
                        backgroundColor: ['#6366f1', '#a5b4fc', '#f43f5e'],
                        borderWidth: 0,
                        borderRadius: 10
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '80%',
                    plugins: { 
                        legend: { position: 'bottom', labels: { boxWidth: 8, padding: 12, font: { weight: 'bold', size: 8 }, color: '#94a3b8' } }
                    }
                }
            });

            if (chartImpact) chartImpact.destroy();
            chartImpact = new Chart(ctxImpact, {
                type: 'bar',
                data: {
                    labels: [''],
                    datasets: [{
                        data: [pChile],
                        backgroundColor: ['#f43f5e'],
                        borderRadius: 8,
                        barThickness: 10
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { display: false, max: 20 }, y: { display: false } }
                }
            });
        }

        window.onload = () => {
            ejecutarSimulacion();
            document.querySelectorAll('.animate-fade-in').forEach((el, index) => {
                el.style.animationDelay = `${index * 0.08}s`;
            });
        };
    </script>
</body>
</html>
